services:
  sentence:
    image: sentence:latest
    container_name: sentence
    ports:
      - "8000:80"
    depends_on:
      - mariadb
    networks:
      - sentence-network
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
    user: "${UID:-1000}:${GID:-1000}"

  mariadb:
    image: mariadb:11
    container_name: sentence_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: sentence
      MYSQL_USER: sentence
      MYSQL_PASSWORD: sentence
      MYSQL_ROOT_PASSWORD: sentence
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - sentence-network

  selenium:
    image: selenium/standalone-chrome
    container_name: sentence_selenium
    ports:
      - "7900:7900" # VNC (pra ver o browser rodando)
    networks:
      - sentence-network
    shm_size: 2gb
    
  senhaunica-faker:
    image: uspdev/senhaunica-faker
    container_name: sentence_senhaunica-faker
    ports:
      - "3141:3141"
    environment:
          - APP_URL=http://auth.local:3141
    networks:
      sentence-network:
        aliases:
          - auth.local

networks:
  sentence-network:

volumes:
  mariadb_data: